<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background radial gradient: deep dark center to near-black -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1025"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>

    <!-- Gold gradient for crate body -->
    <linearGradient id="crateGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5c842"/>
      <stop offset="50%"  stop-color="#d4960a"/>
      <stop offset="100%" stop-color="#a06800"/>
    </linearGradient>

    <!-- Lighter gold for the lid -->
    <linearGradient id="lidGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#c8880a"/>
    </linearGradient>

    <!-- Key gradient: bright gold -->
    <linearGradient id="keyGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#c88800"/>
    </linearGradient>

    <!-- Glow filter for the key and sparkles -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for the crate -->
    <filter id="crateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Inner shadow on crate face -->
    <linearGradient id="crateShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- ── Background circle ── -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#2a1f40" stroke-width="2"/>

  <!-- ── Background sparkles (distant stars) ── -->
  <g opacity="0.35" fill="#f5c842">
    <circle cx="80"  cy="90"  r="2"/>
    <circle cx="430" cy="75"  r="1.5"/>
    <circle cx="460" cy="200" r="2"/>
    <circle cx="55"  cy="340" r="1.5"/>
    <circle cx="420" cy="400" r="2"/>
    <circle cx="130" cy="430" r="1.5"/>
    <circle cx="380" cy="130" r="1"/>
    <circle cx="100" cy="200" r="1"/>
  </g>

  <!-- ── Crate body (main chest) ── -->
  <g filter="url(#shadow)">
    <!-- Crate body rectangle -->
    <rect x="118" y="248" width="276" height="170" rx="12" ry="12"
          fill="url(#crateGold)" filter="url(#crateGlow)"/>
    <!-- Shade overlay -->
    <rect x="118" y="248" width="276" height="170" rx="12" ry="12"
          fill="url(#crateShade)"/>

    <!-- Crate lid -->
    <rect x="118" y="188" width="276" height="75" rx="12" ry="12"
          fill="url(#lidGold)" filter="url(#crateGlow)"/>
    <rect x="118" y="188" width="276" height="75" rx="12" ry="12"
          fill="url(#crateShade)"/>

    <!-- Lid-body divider band -->
    <rect x="118" y="250" width="276" height="12" rx="0"
          fill="#7a4d00" opacity="0.6"/>
  </g>

  <!-- Crate border straps (horizontal) -->
  <rect x="118" y="295" width="276" height="16" rx="3" fill="#7a4d00" opacity="0.5"/>
  <rect x="118" y="355" width="276" height="16" rx="3" fill="#7a4d00" opacity="0.5"/>

  <!-- Crate border straps (vertical) -->
  <rect x="173" y="188" width="16" height="230" rx="3" fill="#7a4d00" opacity="0.4"/>
  <rect x="323" y="188" width="16" height="230" rx="3" fill="#7a4d00" opacity="0.4"/>

  <!-- ── Lock / keyhole on lid ── -->
  <rect x="228" y="212" width="56" height="44" rx="8"
        fill="#5c3600" stroke="#c88800" stroke-width="2.5"/>
  <!-- Keyhole circle -->
  <circle cx="256" cy="228" r="10" fill="#3a2000"/>
  <!-- Keyhole slot -->
  <rect x="251" y="228" width="10" height="14" rx="2" fill="#3a2000"/>

  <!-- ── Floating key above crate ── -->
  <g filter="url(#glow)" transform="translate(256, 145) rotate(-30)">
    <!-- Key bow (ring) -->
    <circle cx="0" cy="-18" r="18" fill="none" stroke="url(#keyGold)" stroke-width="10"/>
    <!-- Key shaft -->
    <rect x="-5" y="-4" width="10" height="48" rx="4" fill="url(#keyGold)"/>
    <!-- Key teeth -->
    <rect x="5"  y="24" width="12" height="7" rx="2" fill="url(#keyGold)"/>
    <rect x="5"  y="35" width="9"  height="7" rx="2" fill="url(#keyGold)"/>
  </g>

  <!-- ── Sparkle stars around key ── -->
  <g fill="#ffe066" filter="url(#glow)">
    <!-- 4-pointed star top-right of key -->
    <polygon points="320,80 324,92 336,92 326,100 330,112 320,104 310,112 314,100 304,92 316,92"
             transform="scale(0.55) translate(270,-20)" opacity="0.9"/>
    <!-- small sparkle left -->
    <polygon points="320,80 324,92 336,92 326,100 330,112 320,104 310,112 314,100 304,92 316,92"
             transform="scale(0.35) translate(-130,80)" opacity="0.7"/>
    <!-- tiny dot sparkles -->
    <circle cx="314" cy="105" r="3" opacity="0.8"/>
    <circle cx="196" cy="118" r="2.5" opacity="0.6"/>
    <circle cx="340" cy="155" r="2" opacity="0.7"/>
  </g>

  <!-- ── Glow halo under crate ── -->
  <ellipse cx="256" cy="420" rx="130" ry="14" fill="#d4960a" opacity="0.15"/>

  <!-- ── "VC" monogram on crate face ── -->
  <text x="256" y="345"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="64"
        font-weight="bold"
        text-anchor="middle"
        fill="#3a2000"
        opacity="0.55"
        letter-spacing="4">VC</text>

</svg>
